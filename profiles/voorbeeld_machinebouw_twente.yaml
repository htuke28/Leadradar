# Eén profiel = één klant/klanttype. Dit is het profiel van Salesia Techniek zelf,
# gebaseerd op de bouwbrief (machinebouw, regio Twente). Deze deployment is dus specifiek
# voor Salesia — voor een volgende klant: kloon deze hele repo naar een nieuwe repo/app,
# en pas dán dit profiel aan (of maak een tweede profiel-bestand in díe kloon).

profiel:
  naam: "Salesia Techniek — Machinebouw, regio Twente"

  sectoren:
    - "Algemene machinebouw"
    - "Pharma-machinebouw"

  # LET OP: onderstaande SBI-codes zijn PLACEHOLDERS ter illustratie van het veld,
  # nog niet geverifieerd tegen de officiële CBS/KvK SBI-lijst. Vervang door de
  # daadwerkelijk juiste codes voordat dit live gebruikt wordt.
  sbi_codes:
    - "2822"
    - "2829"

  grootte_min: 10
  grootte_max: 100

  regio:
    omschrijving: "Twente (~30 min rijden vanaf Enschede)"
    # OpenKvK filtert op plaatsnaam, niet op straal-in-km — dit is dus de werkelijke
    # zoekregio. Vul aan met andere plaatsen als de straal groter moet.
    plaatsen:
      - Enschede
      - Hengelo
      - Almelo
      - Borne
      - Oldenzaal
      - Rijssen
      - Denekamp

  type: "eindklant"  # eindklant | partner

  signalen:
    - vacature_elektromonteur
    - geen_eigen_elektrotechnicus

  gewichten:
    sector: 30
    grootte: 20
    regio: 20
    signaal: 30
